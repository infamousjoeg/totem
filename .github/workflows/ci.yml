name: ci

# Every check here exists because something in this repo was found by it and
# would not have been found otherwise. The race detector caught two test suites
# that were passing by winning a race against an exec rather than by
# construction. Vetting under a second GOOS caught a portability shim that could
# never have compiled on the platform it claimed to serve. The release gate
# refuses to link while a certificate extension still carries a placeholder OID
# arc, and an armed gate that nothing fires is not a gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # EVIDENCE CAPTURE, temporary. internal/attest refuses an Apple-platform
      # binary whose leaf carries an organizational unit, on the stated grounds
      # that platform binaries have none. That claim is false: this runner pool
      # serves several macOS images, and an older one signs /bin/zsh with a leaf
      # carrying OU "Apple Software" while a newer one carries no OU at all. Both
      # are genuine Apple platform leaves and the kernel certifies both.
      #
      # No machine we own can produce the older certificate, so the fix cannot be
      # validated locally against the real artifact, only against a corrected
      # assumption, which is the same mistake one layer up. This step brings the
      # evidence back: it prints the leaf's subject, its extension OIDs, and the
      # DER as base64 so the certificate can be reconstructed and pinned as a
      # test fixture.
      #
      # It runs on EVERY run, pass or fail, because the run that draws the older
      # image may well be one where nothing else went wrong. Delete this step
      # once both variants are pinned as fixtures and the tests no longer read
      # the host's own binaries.
      - name: capture the apple platform signing leaf
        if: always()
        run: |
          echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          sw_vers
          codesign -dv --verbose=4 /bin/zsh 2>&1 | sed 's/^/  /' || true
          d=$(mktemp -d)
          codesign -d --extract-certificates="$d/leaf_" /bin/zsh >/dev/null 2>&1 || true
          if [ ! -f "$d/leaf_0" ]; then
            echo "could not extract a leaf certificate from /bin/zsh"
            exit 0
          fi
          echo "--- subject and issuer ---"
          openssl x509 -inform DER -in "$d/leaf_0" -noout -subject -issuer
          echo "--- extension OIDs ---"
          openssl asn1parse -inform DER -in "$d/leaf_0" | grep -i 'OBJECT' | sed 's/^/  /'
          echo "--- leaf DER, base64 (reconstruct with: base64 -d > leaf.der) ---"
          base64 < "$d/leaf_0"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # The agent is macOS-first and the issuer runs on Linux, so a package
      # that compiles here can still be broken there. Vetting the other way
      # round is what surfaced a build-tagged file that no build selected and
      # that therefore asserted nothing.
      - name: vet linux
        run: GOOS=linux go vet ./...

      # cgo reaches the Secure Enclave; without it the agent falls back to a
      # software key store. Both configurations ship, so both must build.
      - name: build without cgo
        run: CGO_ENABLED=0 go build ./...

      # -race is not an optional extra here. It is the bar, and it has caught
      # defects that plain `go test` reported as passing.
      - name: test with the race detector
        run: go test -race -count=1 ./...

  restore-gate:
    # The ten-minute restore is a RELEASE GATE, so it is measured at release
    # scale rather than at the size the everyday suite can afford. This job
    # fails if a 395 MB issuer database stops restoring inside ten minutes.
    # Current headroom is roughly 300x; if that collapses it collapses here,
    # and not on an operator's box after they have already lost a machine.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: restore two million chain records inside the gate
        env:
          TOTEM_RESTORE_GATE_RECORDS: "2000000"
        # -v is deliberate. Without it the measurement is discarded and the job
        # proves only that the gate was not breached, never what the margin was,
        # which is the number that tells you it is about to be.
        run: go test -count=1 -timeout 30m -run TestRestoreOnAFreshBoxMeetsTheTenMinuteGate -v ./internal/store/

  release-gate:
    # INVERTED 2026-09-08, when PEN 66761 was registered and OIDArcProvisional
    # was cleared. Until then this job succeeded when the release build was
    # REFUSED, and the note said to invert it rather than delete it on the day
    # the PEN arrived. This is that inversion.
    #
    # It is still the same guard, read the other way. A release build must now
    # LINK, and the day it stops linking is the day something put the arc back
    # into a provisional state. Deleting the job would have removed the only
    # thing that notices that, and "the gate we removed because we passed it" is
    # how a placeholder ships in some later release nobody is watching.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: a release build must link on the registered OID arc
        run: |
          if ! go build -tags release ./internal/ca/...; then
            echo "a release build refused to link."
            echo "OIDArcProvisional is non-empty again, so the OID arc is back to being"
            echo "provisional. Read it for what it says is wrong; do not clear it to get"
            echo "green, and do not delete this job."
            exit 1
          fi
          echo "release build linked: the OID arc is the registered PEN, not a placeholder."
